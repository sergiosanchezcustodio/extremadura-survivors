<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Animaciones de enemigos — CC The Lighthouse</title>
<style>
  :root { color-scheme:dark; font:16px system-ui,sans-serif; background:#15191f; color:#f1eee6; }
  body { margin:0; padding:24px; }
  h1 { margin:0 0 8px; }
  p { color:#bec6d1; margin:0 0 20px; }
  main { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; }
  article { min-height:220px; display:grid; grid-template-rows:1fr auto; align-items:center; justify-items:center; padding:14px; background:#252b34; border:1px solid #39424e; }
  canvas { image-rendering:pixelated; image-rendering:crisp-edges; max-width:100%; max-height:240px; }
  strong { padding-top:12px; font-size:14px; }
  #estado { margin-top:18px; color:#a8e2b2; }
</style>
<h1>CC The Lighthouse · ciclos de andar</h1>
<p>Doce hojas horneadas desde las ilustraciones originales. Se reproducen a 10 fotogramas por segundo, sin escalar los píxeles durante el dibujo.</p>
<main id="galeria"></main>
<div id="estado">Cargando las hojas...</div>
<script type="module">
const enemigos = [
  ['n2AntiDisturbios','Anti-disturbios'], ['n2ChicaPoseida','Chica poseída'],
  ['n2ChicoPoseido','Chico poseído'], ['n2MegaRobot','Mega robot'],
  ['n2PoliFlaco','Policía flaco'], ['n2PoliGordo','Policía corpulento'],
  ['n2PoliRobot','Policía robot'], ['n2RobotPersona','Robot humanoide'],
  ['n2Robotin','Robotín'], ['n2SenoraCarro','Señora del carro'],
  ['n2SuperPoli','Súper policía'], ['n2SuperRobotin','Súper robotín']
];
const atlas = await (await fetch('../assets/atlas.json')).json();
const galeria = document.querySelector('#galeria');
const estado = document.querySelector('#estado');
for (const [id,nombre] of enemigos) {
  const meta = atlas.entidades[id];
  if (!meta) throw new Error(`Falta ${id} en el atlas.`);
  const img = new Image();
  img.src = `../assets/${meta.archivo}`;
  await img.decode();
  const tarjeta = document.createElement('article');
  const canvas = document.createElement('canvas');
  canvas.width = meta.w; canvas.height = meta.h;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const escala = Math.min(4, 240 / meta.h);
  canvas.style.width = `${Math.floor(meta.w * escala)}px`;
  canvas.style.height = `${Math.floor(meta.h * escala)}px`;
  const rotulo = document.createElement('strong'); rotulo.textContent = nombre;
  tarjeta.append(canvas, rotulo); galeria.append(tarjeta);
  const fps = 10, total = meta.frames, origen = performance.now();
  function pintar(ahora) {
    const fotograma = Math.floor((ahora - origen) * fps / 1000) % total;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,fotograma*meta.w,0,meta.w,meta.h,0,0,meta.w,meta.h);
    requestAnimationFrame(pintar);
  }
  requestAnimationFrame(pintar);
}
estado.textContent = `${enemigos.length} ciclos cargados · 10 fotogramas por enemigo.`;
</script>
</html>
